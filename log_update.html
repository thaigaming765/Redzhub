<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <title>Log Update</title>
  <style>
    :root { color-scheme: dark; --bg:#080d19; --panel:#111a2d; --muted:#93a0b8; --text:#f4f7ff; --accent:#8b9cff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text); background: radial-gradient(ellipse at 50% -15%, #28345e 0%, transparent 48%), var(--bg);
      display: grid; place-items: center; padding: 28px;
    }
    .shell { width: min(920px, 100%); }
    header { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; }
    .brand { display:flex; align-items:center; gap:12px; font-weight:750; letter-spacing:.2px; font-size:18px; }
    .logo { width:38px; height:38px; display:grid; place-items:center; border-radius:12px; color:#dce2ff; background:linear-gradient(145deg,#7186ff,#4b5bd0); box-shadow:0 8px 26px #5267ef40; }
    .status { border:1px solid #29344c; background:#111a2dcc; border-radius:999px; padding:8px 12px; color:#aab6cd; font-size:12px; letter-spacing:.08em; text-transform:uppercase; }
    main { min-height:390px; border:1px solid #27324a; border-radius:24px; padding:clamp(28px,6vw,62px); background:linear-gradient(145deg,#151f35f2,#0e1729f2); box-shadow:0 28px 90px #0008, inset 0 1px #ffffff0d; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; position:relative; overflow:hidden; }
    main::before { content:""; position:absolute; width:300px; height:300px; border-radius:50%; background:#7587ff12; filter:blur(10px); top:-190px; right:-80px; }
    .eyebrow { color:#98a8ff; font-size:12px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; margin-bottom:18px; }
    h1 { margin:0; font-size:clamp(30px,6vw,54px); line-height:1.12; letter-spacing:-.04em; }
    .message { margin:22px 0 0; color:#bac4d7; font-size:clamp(16px,2.4vw,19px); }
    .version { margin-top:34px; display:inline-flex; align-items:center; gap:8px; border:1px solid #34415f; padding:9px 14px; border-radius:999px; color:#d4dcf0; background:#0b1325a8; font-size:13px; }
    .dot { width:7px; height:7px; border-radius:50%; background:#f0b965; box-shadow:0 0 12px #f0b96590; }
    footer { text-align:center; color:#64718a; font-size:12px; padding-top:20px; }
    @media (max-width:520px) { body{padding:18px} header{margin-bottom:18px} main{min-height:350px;border-radius:20px} .status{font-size:10px;padding:7px 9px} }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="brand"><div class="logo" aria-hidden="true">↻</div><span>Log Update</span></div>
      <div class="status">Update hub</div>
    </header>
    <main>
      <div class="eyebrow">Thông báo cập nhật</div>
      <h1>Log update v39 :(</h1>
      <p class="message">tạm thời chưa có</p>
      <div class="version"><span class="dot"></span> Phiên bản 39</div>
    </main>
    <footer>Log Update · Nơi cập nhật thông tin phiên bản</footer>
  </div>
</body>
</html>
